<h1>The Gate</h1>
<p class="tag">Password, please. The night guide gave it to you. Didn't they?</p>
<form id="gate"><input name="password" autocomplete="off" autofocus> <button>Knock</button></form>
<p id="out"></p>
<script>
gate.onsubmit = async e => { e.preventDefault(); out.textContent = await (await fetch('/gate', { method: 'POST', body: new URLSearchParams(new FormData(gate)) })).text(); };
</script>
