<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hollow Creek Haunted Trail</title><link rel="stylesheet" href="/style.css"></head><body>
<nav><a href="/">Home</a><a href="/staff.html">Staff</a><a href="/gallery.html">Gallery</a><a href="/guestbook.html">Guestbook</a><a href="/contact.html">Hotline</a></nav>
<main>
<h1>Hotline</h1>
<p class="tag">(555) 013-1031 · or press play and dial from here.</p>
<audio id="line" controls src="/audio/menu.wav"></audio>
<div class="pad" id="pad"></div>
<script>
for (const k of '123456789*0#') pad.insertAdjacentHTML('beforeend', `<button>${k}</button>`);
pad.onclick = e => { if (e.target.tagName !== 'BUTTON') return; line.src = '/audio/' + encodeURIComponent(e.target.textContent) + '.wav'; line.play().catch(() => 0); };
line.onerror = () => { line.src = '/audio/unavailable.wav'; line.play(); };
</script>
</main>
<footer>Hollow Creek Haunted Trail · est. 2011 · end of Ashgrove Road, past the second bridge</footer></body></html>
