services:
  ctf:
    build: .
    ports:
      - "8080:5000"
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-dev-secret-change-me}
      - FLAG=${FLAG}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MODEL=${MODEL:-llama-3.1-8b-instant}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
